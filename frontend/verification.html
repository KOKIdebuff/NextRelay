<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T17 浏览器交互断言</title><link rel="stylesheet" href="/src/style.css"><body><h1>T17 合成原型浏览器检查</h1><p>同源 iframe 内运行真实前端模块；不访问业务后端。程序化事件不代替实际设备输入检查。</p><button id="run">运行浏览器交互检查</button><pre id="results" aria-live="polite"></pre><details><summary>验证产物下载辅助</summary><p>仅将浏览器工具已生成的合成页面截图解码为本地 JPEG 下载。不读取文件，不发送网络请求。</p><label>截图名称<input id="shot-name" value="nextrelay.jpg"></label><label>工具生成的 JPEG base64<textarea id="shot-data"></textarea></label><button id="save-shot">下载已捕获的 JPEG 截图</button><p id="shot-status" role="status"></p></details><iframe title="验证中的合成原型" id="subject" src="/" style="width:1200px;height:900px;border:2px solid #17325d"></iframe><script type="module" src="/tests/browser.js"></script></body></html>
