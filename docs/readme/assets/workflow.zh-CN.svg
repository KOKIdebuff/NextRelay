<svg xmlns="http://www.w3.org/2000/svg" width="720" height="800" viewBox="0 0 720 800" role="img" aria-labelledby="title desc"><title id="title">从会话成果，到下一段工作</title><desc id="desc">产品工作流程 · 当前仅交付本地能力子集. 实线：包含当前本地能力 · 虚线：规划中的自动化</desc><rect width="720" height="800" fill="#f5faff"/><g font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif" fill="#10265b"><text x="32" y="47" font-size="29" font-weight="700">从会话成果，到下一段工作</text><text x="32" y="83" font-size="21" fill="#48629a">产品工作流程 · 当前仅交付本地能力子集</text><rect x="32" y="112" width="656" height="88" rx="0" fill="white" stroke="#005bff" stroke-width="2"/><text x="51" y="146" font-size="25" font-weight="700">01  在熟悉的 AI 工具中工作</text><text x="51" y="177" font-size="21" fill="#48629a">一个或多个会话，串行或并行推进项目。</text><path d="M360 202v18m-6-6 6 6 6-6" fill="none" stroke="#005bff" stroke-width="2"/><rect x="32" y="224" width="656" height="88" rx="0" fill="white" stroke="#005bff" stroke-width="2"/><text x="51" y="258" font-size="25" font-weight="700">02  主动把成果带回项目</text><text x="51" y="289" font-size="21" fill="#48629a">当前支持：本地上传、格式解析与正文阅读。</text><path d="M360 314v18m-6-6 6 6 6-6" fill="none" stroke="#005bff" stroke-width="2"/><rect x="32" y="336" width="656" height="88" rx="0" fill="white" stroke="#8191aa" stroke-width="2" stroke-dasharray="8 6"/><text x="51" y="370" font-size="25" font-weight="700">03  整理成果并提出更新 · 规划中</text><text x="51" y="401" font-size="21" fill="#48629a">自动语义提取、匹配与归并尚未接通。</text><path d="M360 426v18m-6-6 6 6 6-6" fill="none" stroke="#005bff" stroke-width="2"/><rect x="32" y="448" width="656" height="88" rx="0" fill="white" stroke="#005bff" stroke-width="2"/><text x="51" y="482" font-size="25" font-weight="700">04  审查变更，了解任务与依赖</text><text x="51" y="513" font-size="21" fill="#48629a">当前支持：已有候选、正式提交、任务及依赖。</text><path d="M360 538v18m-6-6 6 6 6-6" fill="none" stroke="#005bff" stroke-width="2"/><rect x="32" y="560" width="656" height="88" rx="0" fill="white" stroke="#8191aa" stroke-width="2" stroke-dasharray="8 6"/><text x="51" y="594" font-size="25" font-weight="700">05  为下一段会话获取上下文 · 规划中</text><text x="51" y="625" font-size="21" fill="#48629a">真实本地工作台的 Context Sync 尚未接通。</text><text x="32" y="770" font-size="20" fill="#48629a">实线：包含当前本地能力 · 虚线：规划中的自动化</text></g></svg>