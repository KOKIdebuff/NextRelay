<svg xmlns="http://www.w3.org/2000/svg" width="720" height="800" viewBox="0 0 720 800" role="img" aria-labelledby="title desc"><title id="title">From session outcomes to the next step</title><desc id="desc">Product workflow · current delivery is a local subset. Solid: includes current local capability · Dashed: planned automation</desc><rect width="720" height="800" fill="#f5faff"/><g font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif" fill="#10265b"><text x="32" y="47" font-size="29" font-weight="700">From session outcomes to the next step</text><text x="32" y="83" font-size="21" fill="#48629a">Product workflow · current delivery is a local subset</text><rect x="32" y="112" width="656" height="88" rx="0" fill="white" stroke="#005bff" stroke-width="2"/><text x="51" y="146" font-size="25" font-weight="700">01  Work in your AI tool</text><text x="51" y="177" font-size="21" fill="#48629a">Use one or many sessions, in sequence or in parallel.</text><path d="M360 202v18m-6-6 6 6 6-6" fill="none" stroke="#005bff" stroke-width="2"/><rect x="32" y="224" width="656" height="88" rx="0" fill="white" stroke="#005bff" stroke-width="2"/><text x="51" y="258" font-size="25" font-weight="700">02  Bring outcomes into your project</text><text x="51" y="289" font-size="21" fill="#48629a">Current: local file upload, format parsing and reading.</text><path d="M360 314v18m-6-6 6 6 6-6" fill="none" stroke="#005bff" stroke-width="2"/><rect x="32" y="336" width="656" height="88" rx="0" fill="white" stroke="#8191aa" stroke-width="2" stroke-dasharray="8 6"/><text x="51" y="370" font-size="25" font-weight="700">03  Organize and propose updates · planned</text><text x="51" y="401" font-size="21" fill="#48629a">Automatic extraction, matching and merging are not connected.</text><path d="M360 426v18m-6-6 6 6 6-6" fill="none" stroke="#005bff" stroke-width="2"/><rect x="32" y="448" width="656" height="88" rx="0" fill="white" stroke="#005bff" stroke-width="2"/><text x="51" y="482" font-size="25" font-weight="700">04  Review changes and track the work</text><text x="51" y="513" font-size="21" fill="#48629a">Current: existing candidates, commits, tasks and dependencies.</text><path d="M360 538v18m-6-6 6 6 6-6" fill="none" stroke="#005bff" stroke-width="2"/><rect x="32" y="560" width="656" height="88" rx="0" fill="white" stroke="#8191aa" stroke-width="2" stroke-dasharray="8 6"/><text x="51" y="594" font-size="25" font-weight="700">05  Take context into the next session · planned</text><text x="51" y="625" font-size="21" fill="#48629a">Context Sync is not connected in the real local workspace.</text><text x="32" y="770" font-size="20" fill="#48629a">Solid: includes current local capability · Dashed: planned automation</text></g></svg>